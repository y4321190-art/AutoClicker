name: Build & Sign APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Gradle izni ver
        run: chmod +x gradlew

      - name: APK derle
        run: ./gradlew assembleRelease

      - name: Keystore dosyasını oluştur
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: APK imzala
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks keystore.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --key-alias ${{ secrets.KEY_ALIAS }} \
            --key-pass pass:${{ secrets.KEY_PASSWORD }} \
            --out app/build/outputs/apk/release/autoclicker-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: APK doğrula
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify \
            app/build/outputs/apk/release/autoclicker-signed.apk

      - name: APK'yı artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-signed
          path: app/build/outputs/apk/release/autoclicker-signed.apk
          retention-days: 30
